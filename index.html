<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Mi Tienda - Réplica Cone Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --brand-purple: #6b21a8;
      --brand-hover: #581c87;
    }
    .bg-brand { background-color: var(--brand-purple); }
    .bg-brand:hover { background-color: var(--brand-hover); }
    .text-brand { color: var(--brand-purple); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col font-sans">

  <!-- ENCABEZADO (Sin botón visible de admin para clientes) -->
  <header class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
        <div class="bg-brand text-white p-2 rounded-xl text-xl">
          <i class="fa-solid fa-store"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-gray-900">Mi Tienda Online</h1>
          <p class="text-xs text-gray-500">Catálogo de Productos Exclusivos</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button onclick="goHome()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center space-x-1">
          <i class="fa-solid fa-house text-xs"></i>
          <span>Inicio</span>
        </button>

        <button onclick="openCartModal()" class="relative p-2 text-gray-600 hover:text-brand transition">
          <i class="fa-solid fa-cart-shopping text-2xl"></i>
          <span id="cartCount" class="absolute -top-1 -right-1 bg-brand text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BANNER ADMIN (Solo visible cuando inicias sesión con #admin) -->
  <div id="adminBanner" class="hidden bg-amber-500 text-slate-900 font-semibold px-4 py-2 text-center text-sm shadow-inner flex justify-between items-center max-w-7xl mx-auto w-full">
    <span><i class="fa-solid fa-shield-halved mr-2"></i> MODO ADMINISTRADOR ACTIVO — Precios de costo visibles solo para ti.</span>
    <button onclick="logoutAdmin()" class="bg-slate-900 text-white text-xs px-2.5 py-1 rounded hover:bg-slate-800">Cerrar Sesión</button>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    <!-- BARRA DE BÚSQUEDA -->
    <div class="bg-white p-4 rounded-xl shadow-sm mb-4 flex flex-col md:flex-row gap-4 items-center justify-between">
      <div class="relative w-full md:w-96">
        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="¿Qué estás buscando? (Nombre o SKU)..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600 text-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
      </div>

      <button onclick="loadFastCatalog()" class="bg-brand text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-brand-hover transition flex items-center space-x-2">
        <i class="fa-solid fa-rotate"></i>
        <span>Sincronizar Catálogo</span>
      </button>
    </div>

    <!-- CATEGORÍAS -->
    <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-4 text-sm scrollbar-none">
      <span class="font-bold text-gray-500 text-xs uppercase mr-2">Categorías:</span>
      <button onclick="filterCategory('all')" class="cat-btn bg-brand text-white px-3 py-1.5 rounded-full font-medium shadow-sm transition whitespace-nowrap">Todos</button>
      <button onclick="filterCategory('Cocina')" class="cat-btn bg-white hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-medium border shadow-sm transition whitespace-nowrap">Cocina</button>
      <button onclick="filterCategory('Baño')" class="cat-btn bg-white hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-medium border shadow-sm transition whitespace-nowrap">Baño</button>
      <button onclick="filterCategory('Hogar')" class="cat-btn bg-white hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-medium border shadow-sm transition whitespace-nowrap">Hogar y Decoración</button>
    </div>

    <!-- GRID DE PRODUCTOS -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="col-span-full text-center py-12 text-gray-500">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-brand mb-3"></i>
        <p>Cargando productos...</p>
      </div>
    </div>
  </main>

  <!-- MODAL CARRITO -->
  <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-end hidden">
    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
      <div class="p-4 border-b flex justify-between items-center bg-gray-50">
        <h2 class="font-bold text-lg text-gray-800"><i class="fa-solid fa-cart-shopping mr-2 text-brand"></i> Tu Pedido</h2>
        <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div id="cartItemsContainer" class="flex-grow overflow-y-auto p-4 space-y-4"></div>

      <div class="p-4 border-t bg-gray-50 space-y-3">
        <div class="flex justify-between font-bold text-lg">
          <span>Total:</span>
          <span id="cartTotal" class="text-brand">$0.00</span>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-semibold text-gray-600">Nombre del Cliente:</label>
          <input type="text" id="clientName" placeholder="Tu nombre completo" class="w-full border rounded-lg p-2 text-sm">
          
          <label class="block text-xs font-semibold text-gray-600">Dirección de Entrega:</label>
          <input type="text" id="clientAddress" placeholder="Ej: Paseos del Lago 2..." class="w-full border rounded-lg p-2 text-sm">
        </div>

        <button onclick="sendOrderWhatsApp()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 transition flex items-center justify-center space-x-2 shadow-lg">
          <i class="fa-brands fa-whatsapp text-xl"></i>
          <span>Enviar Pedido por WhatsApp</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL ADMIN (Oculto para clientes) -->
  <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="font-bold text-lg"><i class="fa-solid fa-lock mr-2 text-brand"></i> Panel de Administración</h3>
        <button onclick="toggleAdminModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div id="adminLoginForm" class="space-y-4">
        <input type="password" id="adminPassword" placeholder="Contraseña de Admin" class="w-full border rounded-lg p-2.5 text-sm">
        <button onclick="loginAdmin()" class="w-full bg-gray-900 text-white font-bold py-2.5 rounded-lg hover:bg-gray-800 transition">Entrar</button>
      </div>

      <div id="adminPanelContent" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">WhatsApp de Ventas:</label>
          <input type="text" id="adminPhone" placeholder="Ej: 5215512345678" class="w-full border rounded-lg p-2 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Margen de Ganancia Global (%):</label>
          <div class="flex gap-2">
            <input type="number" id="globalMargin" placeholder="30" class="w-full border rounded-lg p-2 text-sm">
            <button onclick="applyGlobalMargin()" class="bg-brand text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-brand-hover">Aplicar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let products = [];
    let filteredProducts = [];
    let cart = {};
    let isAdmin = false;
    let adminWhatsApp = "5215500000000";
    let activeCategory = 'all';
    let marginMultiplier = 1.30;

    // Catálogo optimizado de Cone Shop con CDN CDN proxy bypass
    const rawCatalog = [
      { sku: "53531", title: "Recipiente Hermético Transparente 900 ml", costPrice: 32.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/53531.jpg" },
      { sku: "53530", title: "Recipiente Hermético Transparente 700 ml", costPrice: 29.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/53530.jpg" },
      { sku: "53529", title: "Recipiente Hermético Transparente 500 ml", costPrice: 33.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/53529.jpg" },
      { sku: "51459", title: "Set de Recipientes de Cerámica", costPrice: 141.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/51459.jpg" },
      { sku: "53598", title: "Brocha con Recipiente gris claro", costPrice: 25.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/53598.jpg" },
      { sku: "52704", title: "Recipientes de Cerámica con Tapa Plástica", costPrice: 160.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/52704.jpg" },
      { sku: "53149", title: "Set de Recipientes de Acero de colores con Tapas Herméticas", costPrice: 99.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/53149.jpg" },
      { sku: "53484", title: "Set de Recipientes Herméticos Redondos (3 Piezas, Blanco)", costPrice: 89.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/53484.jpg" },
      { sku: "50477", title: "Tapete Antideslizante de Baño 40 x 60 cm", costPrice: 69.00, category: "Baño", rawImg: "https://armamipedido.mx/cdn/shop/files/50477.jpg" },
      { sku: "47664", title: "Delantal de Cocina Verde", costPrice: 39.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/47664.jpg" },
      { sku: "47663", title: "Delantal de Cocina Rojo", costPrice: 39.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/47663.jpg" },
      { sku: "51457", title: "Set de Utensilios de Cocina de Silicón con Mango de Madera", costPrice: 170.00, category: "Cocina", rawImg: "https://armamipedido.mx/cdn/shop/files/51457.jpg" },
      { sku: "53709", title: "Aromatizante con Varillas (Lavanda)", costPrice: 45.00, category: "Hogar", rawImg: "https://armamipedido.mx/cdn/shop/files/53709.jpg" },
      { sku: "47738", title: "Termómetro Digital", costPrice: 33.00, category: "Hogar", rawImg: "https://armamipedido.mx/cdn/shop/files/47738.jpg" }
    ];

    function loadFastCatalog() {
      products = rawCatalog.map(item => ({
        sku: item.sku,
        title: item.title,
        costPrice: item.costPrice,
        sellPrice: item.costPrice * marginMultiplier,
        image: `https://wsrv.nl/?url=${encodeURIComponent(item.rawImg)}&w=400&output=jpg`,
        category: item.category
      }));

      applyFilters();
    }

    function goHome() {
      document.getElementById('searchInput').value = '';
      activeCategory = 'all';
      updateCategoryButtons();
      applyFilters();
    }

    function filterCategory(cat) {
      activeCategory = cat;
      updateCategoryButtons();
      applyFilters();
    }

    function updateCategoryButtons() {
      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => {
        if ((activeCategory === 'all' && btn.innerText === 'Todos') || btn.innerText === activeCategory) {
          btn.className = "cat-btn bg-brand text-white px-3 py-1.5 rounded-full font-medium shadow-sm transition whitespace-nowrap";
        } else {
          btn.className = "cat-btn bg-white hover:bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-medium border shadow-sm transition whitespace-nowrap";
        }
      });
    }

    function filterProducts() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      
      filteredProducts = products.filter(p => {
        const matchesQuery = !query || p.title.toLowerCase().includes(query) || p.sku.toLowerCase().includes(query);
        const matchesCategory = activeCategory === 'all' || p.category === activeCategory;
        return matchesQuery && matchesCategory;
      });

      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      if (filteredProducts.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400">
            <i class="fa-solid fa-magnifying-glass text-3xl mb-2"></i>
            <p>No se encontraron productos coincidentes.</p>
          </div>
        `;
        return;
      }

      filteredProducts.forEach(p => {
        const qty = cart[p.sku] || 0;
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border p-4 flex flex-col justify-between hover:shadow-md transition";

        card.innerHTML = `
          <div>
            <div class="w-full h-48 bg-gray-50 rounded-xl overflow-hidden mb-3 flex items-center justify-center p-2">
              <img src="${p.image}" alt="${p.title}" class="object-contain h-full w-full" onerror="this.onerror=null; this.src='https://via.placeholder.com/300?text=Cone+Shop'">
            </div>
            <span class="text-xs text-gray-400 font-mono">SKU: ${p.sku}</span>
            <h3 class="font-bold text-gray-800 text-sm mt-1 leading-snug">${p.title}</h3>
            
            <div class="mt-3">
              ${isAdmin ? `
                <div class="text-xs text-gray-400 line-through">Costo Prov: $${p.costPrice.toFixed(2)}</div>                 <div class="text-lg font-bold text-brand">$${p.sellPrice.toFixed(2)}</div>
              ` : `
                <span class="text-xl font-extrabold text-brand">$${p.sellPrice.toFixed(2)}</span>
              `}
            </div>
          </div>

          <div class="mt-4 pt-3 border-t">
            <div class="flex items-center justify-between bg-gray-100 rounded-lg p-1 mb-2">
              <button onclick="updateQty('${p.sku}', -1)" class="w-8 h-8 rounded-md bg-white shadow flex items-center justify-center font-bold text-gray-600">-</button>
              <span class="font-bold text-sm px-2">${qty}</span>
              <button onclick="updateQty('${p.sku}', 1)" class="w-8 h-8 rounded-md bg-white shadow flex items-center justify-center font-bold text-gray-600">+</button>
            </div>
            <button onclick="updateQty('${p.sku}', 1)" class="w-full bg-brand text-white text-sm font-bold py-2 rounded-xl hover:bg-brand-hover transition">
              Agregar al pedido
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updateQty(sku, change) {
      cart[sku] = (cart[sku] || 0) + change;
      if (cart[sku] <= 0) delete cart[sku];
      document.getElementById('cartCount').innerText = Object.values(cart).reduce((a, b) => a + b, 0);
      renderProducts();
    }

    function openCartModal() {
      const container = document.getElementById('cartItemsContainer');
      container.innerHTML = '';
      let total = 0;

      Object.keys(cart).forEach(sku => {
        const p = products.find(x => x.sku === sku);
        if (p) {
          const itemTotal = p.sellPrice * cart[sku];
          total += itemTotal;
          container.innerHTML += `
            <div class="flex justify-between items-center border-b pb-2">
              <div>
                <p class="font-bold text-sm text-gray-800">${p.title}</p>
                <p class="text-xs text-gray-500">${cart[sku]} x $${p.sellPrice.toFixed(2)}</p>
              </div>
              <span class="font-bold text-sm text-brand">$${itemTotal.toFixed(2)}</span>
            </div>
          `;
        }
      });

      document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
      document.getElementById('cartModal').classList.remove('hidden');
    }

    function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }

    function sendOrderWhatsApp() {
      const name = document.getElementById('clientName').value || 'Cliente';
      const address = document.getElementById('clientAddress').value || 'No especificada';
      let msg = `*NUEVO PEDIDO DE COMPRA*\n*Cliente:* ${name}\n*Dirección:* ${address}\n\n*PRODUCTOS:*\n`;
      let total = 0;

      Object.keys(cart).forEach(sku => {
        const p = products.find(x => x.sku === sku);
        if (p) {
          const itemTotal = p.sellPrice * cart[sku];
          total += itemTotal;
          msg += `- ${cart[sku]}x ${p.title} (SKU: ${p.sku}) = $${itemTotal.toFixed(2)}\n`;
        }
      });

      msg += `\n*TOTAL A PAGAR:* $${total.toFixed(2)}`;
      window.open(`https://wa.me/${adminWhatsApp}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function toggleAdminModal() { document.getElementById('adminModal').classList.toggle('hidden'); }

    function loginAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === 'admin123' || pass === '1234') {
        isAdmin = true;
        document.getElementById('adminLoginForm').classList.add('hidden');
        document.getElementById('adminPanelContent').classList.remove('hidden');
        document.getElementById('adminBanner').classList.remove('hidden');
        renderProducts();
      } else { alert('Contraseña incorrecta'); }
    }

    function logoutAdmin() {
      isAdmin = false;
      document.getElementById('adminBanner').classList.add('hidden');
      toggleAdminModal();
      renderProducts();
    }

    function applyGlobalMargin() {
      const margin = parseFloat(document.getElementById('globalMargin').value) || 0;
      marginMultiplier = 1 + (margin / 100);
      products.forEach(p => p.sellPrice = p.costPrice * marginMultiplier);
      renderProducts();
      alert(`Se aplicó un ${margin}% de ganancia a todos los productos.`);
    }

    // Detección de acceso secreto a Admin
    function checkAdminHash() {
      if (window.location.hash === '#admin') {
        toggleAdminModal();
      }
    }

    window.addEventListener('hashchange', checkAdminHash);
    
    // Atajo de teclado secreto: Ctrl + Shift + A
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
        toggleAdminModal();
      }
    });

    window.onload = () => {
      loadFastCatalog();
      checkAdminHash();
    };
  </script>
</body>
</html>
